<!--
    Add Grades Page
    Used to assign marks to students
-->


<!DOCTYPE html>

<html>


<head>

    <title>
        Add Grades
    </title>


    <link rel="stylesheet" href="/static/style.css">


</head>



<body>


<div class="container">


<h1>
    Add Student Grades
</h1>



<form method="POST">


<label>
    Roll Number:
</label>


<br>


<input
type="number"
name="roll"
placeholder="Enter roll number"
required
>


<br><br>



<label>
    Subject:
</label>


<br>


<input
type="text"
name="subject"
placeholder="Example: Math"
required
>


<br><br>




<label>
    Marks:
</label>


<br>


<input
type="number"
name="marks"
placeholder="Enter marks (0-100)"
required
>


<br><br>




<button type="submit">

    Add Grade

</button>



</form>




<br>



<p class="message">

{{ message }}

</p>




<a href="/">
    Back to Home
</a>



</div>



</body>


</html>
